<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود به سامانه نوبت‌دهی سوخت</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, system-ui, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: #f8fafc; padding: 16px;
    }
    .card {
      width: 100%; max-width: 380px; background: #1e293b; border: 1px solid #334155;
      border-radius: 16px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 6px; font-size: 1.2rem; }
    p { margin: 0 0 18px; color: #94a3b8; font-size: 0.85rem; }
    label { display: block; font-size: 0.82rem; color: #cbd5e1; margin-top: 12px; margin-bottom: 4px; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #334155;
      background: #0b1220; color: #f8fafc; font-size: 0.92rem;
    }
    button {
      width: 100%; margin-top: 18px; padding: 11px; border: none; border-radius: 10px;
      background: #3b82f6; color: #fff; font-size: 0.95rem; font-weight: bold; cursor: pointer;
    }
    .err { color: #f87171; font-size: 0.84rem; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔐 ورود به ربات نوبت‌دهی سوخت</h1>
    <p>نام کاربری و رمز عبور خود را وارد کنید.</p>
    <form onsubmit="doLogin(event)">
      <label>نام کاربری</label>
      <input type="text" id="username" required autofocus />
      <label>رمز عبور</label>
      <input type="password" id="password" required />
      <button type="submit">ورود</button>
      <div id="err" class="err"></div>
    </form>
  </div>
  <script>
    async function doLogin(e) {
      e.preventDefault();
      const err = document.getElementById('err');
      err.style.display = 'none';
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const d = await res.json();
      if (!res.ok) {
        err.textContent = d.detail || 'خطا در ورود';
        err.style.display = 'block';
        return;
      }
      window.location.href = '/';
    }
  </script>
</body>
</html>
